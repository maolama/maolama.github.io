<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@600&family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    function clock() {
      const el = document.getElementById('clock');
      if (!el) return;
      el.textContent = new Date().toLocaleTimeString(document.documentElement.lang === 'fa' ? 'fa-IR' : 'en-US', { hour: '2-digit', minute: '2-digit' });
    }
    function draggable() {
      const win = document.querySelector('.win'), bar = document.querySelector('.win-bar');
      let sx, sy, ox = 0, oy = 0, drag = false;
      bar.addEventListener('pointerdown', (e) => {
        if (innerWidth < 900 || e.target.closest('a,button')) return;
        drag = true; sx = e.clientX - ox; sy = e.clientY - oy; bar.setPointerCapture(e.pointerId);
      });
      bar.addEventListener('pointermove', (e) => { if (!drag) return; ox = e.clientX - sx; oy = e.clientY - sy; win.style.translate = `${ox}px ${oy}px`; });
      bar.addEventListener('pointerup', () => { drag = false; });
    }

    Site.init({
      id: 'desktop', theme: { h: 225, c: 0.11 }, icons: ['folder', 'sticky_note_2', 'apps'],

      shell: (c, x) => `
        <header class="menubar">
          <a class="mb-logo" href="#/"><span class="ms fill">apps</span></a>
          <b class="body-s">${x.esc(c.name)}</b>
          <nav class="mb-menu">${x.nav.map((n) => `<a class="body-s" data-nav="${n.id}" href="${n.href}">${x.esc(n.label)}</a>`).join('')}</nav>
          <span class="grow"></span>
          ${x.paletteBtn('mb-btn')}${x.modeBtn('mb-btn')}${x.langBtn('mb-btn lang', true)}
          <span class="body-s clock" id="clock" dir="ltr"></span>
        </header>
        <div class="desk">
          <div class="win">
            <div class="win-bar"><span class="lights"><a href="#/" aria-label="close"></a><i></i><i></i></span><span class="body-s win-title" id="wtitle"></span></div>
            <main id="view"></main>
          </div>
          <aside class="widgets">
            <figure class="polaroid">${x.photoTag('', 220, 220)}<figcaption>${x.esc(c.short)}</figcaption></figure>
            <div class="sticky"><p class="sticky-h"><span class="ms">sticky_note_2</span>${x.esc(c.ui.now)}</p>${c.now.map((n) => `<p>• ${x.esc(n.text)}</p>`).join('')}</div>
            <div class="widget where"><span class="ms">location_on</span><div><span class="label-m muted">${x.esc(c.ui.lives)}</span><b>${x.esc(c.location)}</b></div></div>
          </aside>
        </div>
        <nav class="dock" aria-label="Main">
          ${x.nav.map((n) => `<a class="dock-ic" data-nav="${n.id}" href="${n.href}" title="${x.esc(n.label)}"><span class="ms">${n.icon}</span><span class="dock-tip label-m">${x.esc(n.label)}</span></a>`).join('')}
          <span class="dock-sep"></span>
          ${x.socials.map((s) => `<a class="dock-ic soc" href="${s.url}" target="_blank" rel="noopener" title="${x.esc(s.label)}">${x.brand(s.id)}<span class="dock-tip label-m">${x.esc(s.label)}</span></a>`).join('')}
        </nav>`,

      mount() { clock(); clearInterval(window.__clk); window.__clk = setInterval(clock, 20000); draggable(); },
      after(page, c) { document.getElementById('wtitle').textContent = c.ui.nav[page]; },
      scroller: () => (innerWidth >= 900 ? document.getElementById('view') : window),

      pages: {
        home: (c, x) => {
          const e = x.esc, u = c.ui;
          return `
          <section class="readme">
            <p class="label-l hello">${e(c.hello)}</p>
            <h1 class="headline-l">${e(c.headline)}</h1>
            <p class="body-l muted">${e(c.intro)}</p>
            <div class="actions"><a class="btn filled ripple" href="#/work">${e(u.seeWork)}</a><a class="btn tonal ripple" href="#/about">${e(u.moreAbout)}</a></div>
          </section>
          <h2 class="title-m folder-h"><span class="ms">folder</span>${e(u.focus)}</h2>
          ${x.focus()}
          <h2 class="title-m folder-h"><span class="ms">folder</span>${e(u.loves)}</h2>
          ${x.hobbies()}`;
        },
      },
    });
  </script>
</body>
</html>
