<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    Site.init((c, x) => {
      const u = c.ui, e = x.esc;
      const tags = (t) => t ? `<ul class="tags">${t.map((s) => `<li>${e(s)}</li>`).join('')}</ul>` : '';
      const entries = (list) => `<ol class="entries">${list.map((i) => `
        <li>
          <div class="when">${e(i.when)}</div>
          <div>
            <h3>${e(i.title)}</h3>
            <p class="org">${e(i.org)}</p>
            <p class="desc">${e(i.desc)}</p>
            ${tags(i.tags)}
          </div>
        </li>`).join('')}</ol>`;
      const sections = ['about', 'experience', 'education', 'research', 'publications', 'projects'];

      return `
      <aside class="side"><div class="side-inner">
        <img class="photo" src="${x.photo}" alt="${e(c.name)}" width="132" height="165">
        <h1 class="name">${e(c.name)}</h1>
        <p class="role">${e(c.role)}</p>
        <p class="loc">${e(c.location)}</p>
        <ul class="links">
          ${x.links.map((l) => `<li><a href="${l.url}" target="_blank" rel="noopener">${e(l.label)}</a></li>`).join('')}
          <li><a class="email" dir="ltr" href="mailto:${x.email}">${x.email}</a></li>
        </ul>
        <nav class="toc">${sections.map((k) => `<a href="#${k}">${e(u[k])}</a>`).join('')}</nav>
        <div class="actions">
          <a class="btn" href="${x.cv}" target="_blank" rel="noopener">${e(u.cv)}</a>
          ${x.langToggle('btn btn-ghost')}
        </div>
      </div></aside>

      <main class="main">
        <section id="about" class="intro">
          <p class="tagline">${e(c.tagline)}</p>
          ${c.about.map((p) => `<p>${x.rich(p)}</p>`).join('')}
        </section>

        <section id="experience"><h2>${e(u.experience)}</h2>${entries(c.experience)}</section>
        <section id="education"><h2>${e(u.education)}</h2>${entries(c.education)}</section>

        <section id="research">
          <h2>${e(u.research)}</h2>
          <dl class="interests">${c.research.map((r) => `<div><dt>${e(r.title)}</dt><dd>${e(r.desc)}</dd></div>`).join('')}</dl>
        </section>

        <section id="publications">
          <h2>${e(u.publications)}</h2>
          <ol class="pubs" lang="en" dir="ltr">${x.pubs.map((p) => `
            <li>
              <p class="pt">${e(p.title)}</p>
              <p class="pa">${x.rich(p.authors)}</p>
              <p class="pv"><em>${e(p.venue)}</em> · ${p.year}</p>
              <p class="pl">${p.links.map((l) => `<a href="${l.url}">[${e(l.label)}]</a>`).join(' ')}</p>
            </li>`).join('')}</ol>
          <p><a href="${x.links[0].url}" target="_blank" rel="noopener">${e(u.allPubs)} →</a></p>
        </section>

        <section id="projects">
          <h2>${e(u.projects)}</h2>
          <ul class="projects">${c.projects.map((p) => `
            <li><a href="${p.url}"><h3>${e(p.title)}</h3><p class="desc">${e(p.desc)}</p>${tags(p.tags)}</a></li>`).join('')}</ul>
        </section>

        <footer>© ${x.year} ${e(c.name)}</footer>
      </main>`;
    });
  </script>
</body>
</html>
