<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@500;600&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    Site.init((c, x) => {
      const u = c.ui, e = x.esc;
      const entries = (list) => `<ol class="entries">${list.map((i) => `
        <li>
          <span class="when">${e(i.when)}</span>
          <h3>${e(i.title)}</h3>
          <p class="org">${e(i.org)}</p>
          <p>${e(i.desc)}</p>
        </li>`).join('')}</ol>`;
      const nav = ['about', 'experience', 'research', 'publications', 'projects', 'contact'];

      return `
      <header class="mast">
        <div class="wrap mast-top">
          <span>${e(u.masthead)}</span>
          <span class="edition">${e(u.edition)}</span>
          ${x.langToggle('lang')}
        </div>
        <div class="wrap"><h1 class="title">${e(c.name)}</h1></div>
        <div class="wrap mast-bottom">
          <span class="role">${e(c.role)}</span>
          <nav>${nav.map((k) => `<a href="#${k}">${e(u[k])}</a>`).join('')}</nav>
        </div>
      </header>

      <main class="wrap">
        <section id="about" class="lede">
          <figure class="portrait">
            <img src="${x.photo}" alt="${e(c.name)}" width="200" height="250">
            <figcaption>${e(u.photoCaption)} — ${e(c.location)}</figcaption>
          </figure>
          <div class="lede-text">
            <p class="standfirst">${e(c.tagline)}</p>
            <div class="body-text">${c.about.map((p) => `<p>${x.rich(p)}</p>`).join('')}</div>
          </div>
          <aside class="facts">
            <h2 class="kicker">${e(u.currently)}</h2>
            <dl>${c.facts.map((f) => `<div><dt>${e(f.k)}</dt><dd>${e(f.v)}</dd></div>`).join('')}</dl>
            <a class="cv" href="${x.cv}" target="_blank" rel="noopener">${e(u.cv)} <span class="arr">→</span></a>
          </aside>
        </section>

        <div class="three">
          <section id="experience"><h2 class="kicker">${e(u.experience)}</h2>${entries(c.experience)}</section>
          <section id="education"><h2 class="kicker">${e(u.education)}</h2>${entries(c.education)}</section>
          <section id="research">
            <h2 class="kicker">${e(u.research)}</h2>
            <ol class="research">${c.research.map((r) => `<li><h3>${e(r.title)}</h3><p>${e(r.desc)}</p></li>`).join('')}</ol>
          </section>
        </div>

        <section id="publications" class="block">
          <h2 class="kicker">${e(u.publications)}</h2>
          <ol class="pubs" lang="en" dir="ltr">${x.pubs.map((p) => `
            <li>
              <span class="yr">${p.year}</span>
              <div>
                <h3>${e(p.title)}</h3>
                <p class="authors">${x.rich(p.authors)}</p>
                <p class="venue">${e(p.venue)}</p>
                <p class="plinks">${p.links.map((l) => `<a href="${l.url}">${e(l.label)}</a>`).join('')}</p>
              </div>
            </li>`).join('')}</ol>
          <a class="more" href="${x.links[0].url}" target="_blank" rel="noopener">${e(u.allPubs)} <span class="arr">→</span></a>
        </section>

        <section id="projects" class="block">
          <h2 class="kicker">${e(u.projects)}</h2>
          <div class="features">${c.projects.map((p, i) => `
            <a class="feature" href="${p.url}">
              <span class="no">${(i + 1).toLocaleString(x.lang === 'fa' ? 'fa-IR' : 'en-US', { minimumIntegerDigits: 2 })}</span>
              <h3>${e(p.title)}</h3>
              <p>${e(p.desc)}</p>
              <span class="ftags">${p.tags.map(e).join(' · ')}</span>
            </a>`).join('')}</div>
        </section>
      </main>

      <footer id="contact" class="colophon">
        <div class="wrap">
          <h2 class="kicker">${e(u.contact)}</h2>
          <p class="sign">${e(u.cta)}</p>
          <p class="note">${e(u.contactText)}</p>
          <a class="mail" dir="ltr" href="mailto:${x.email}">${x.email}</a>
          <ul class="flinks">${x.links.map((l) => `<li><a href="${l.url}" target="_blank" rel="noopener">${e(l.label)}</a></li>`).join('')}</ul>
          <p class="copy">© ${x.year} ${e(c.name)}</p>
        </div>
      </footer>`;
    });
  </script>
</body>
</html>
