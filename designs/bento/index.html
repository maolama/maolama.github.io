<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    Site.init((c, x) => {
      const u = c.ui, e = x.esc;
      const arrow = '<span class="arr" aria-hidden="true">↗</span>';
      const timeline = (list) => `<ol class="tl">${list.map((i) => `
        <li>
          <div class="tl-head"><h3>${e(i.title)}</h3><span class="when">${e(i.when)}</span></div>
          <p class="org">${e(i.org)}</p>
          <p class="muted">${e(i.desc)}</p>
        </li>`).join('')}</ol>`;
      const initials = c.name.split(' ').map((w) => w[0]).join('').slice(0, 3);

      return `
      <div class="wrap">
        <header class="bar">
          <a class="mark" href="#">${e(initials)}</a>
          <div class="bar-actions">
            ${x.langToggle('pill')}
            <a class="pill solid" href="${x.cv}" target="_blank" rel="noopener">${e(u.cv)}</a>
          </div>
        </header>

        <div class="bento">
          <section class="t hero">
            <img class="avatar" src="${x.photo}" alt="" width="64" height="64">
            <span class="chip"><i></i>${e(c.role)}</span>
            <h1>${e(c.name)}</h1>
            <p class="tagline">${e(c.tagline)}</p>
            <div class="btns">
              <a class="b primary" href="mailto:${x.email}">${e(u.cta)}</a>
              <a class="b" href="#publications">${e(u.publications)}</a>
            </div>
          </section>

          <figure class="t photo"><img src="${x.photo}" alt="${e(c.name)}"></figure>

          <section class="t now">
            <h2 class="lbl">${e(u.currently)}</h2>
            <dl>${c.facts.slice(0, 3).map((f) => `<div><dt>${e(f.k)}</dt><dd>${e(f.v)}</dd></div>`).join('')}</dl>
          </section>

          <section class="t links">
            <h2 class="lbl">${e(u.links)}</h2>
            <ul>${x.links.map((l) => `<li><a href="${l.url}" target="_blank" rel="noopener">${e(l.label)}${arrow}</a></li>`).join('')}</ul>
          </section>

          <a class="t contact" id="contact" href="mailto:${x.email}">
            <h2 class="lbl">${e(u.contact)}</h2>
            <p class="big">${e(u.cta)}</p>
            <span class="em" dir="ltr">${x.email}</span>
            ${arrow}
          </a>

          <section class="t about" id="about">
            <h2 class="lbl">${e(u.about)}</h2>
            ${c.about.map((p) => `<p>${x.rich(p)}</p>`).join('')}
          </section>

          <section class="t research" id="research">
            <h2 class="lbl">${e(u.research)}</h2>
            <ol class="rl">${c.research.map((r) => `<li><h3>${e(r.title)}</h3><p class="muted">${e(r.desc)}</p></li>`).join('')}</ol>
          </section>

          <section class="t exp" id="experience"><h2 class="lbl">${e(u.experience)}</h2>${timeline(c.experience)}</section>
          <section class="t edu" id="education"><h2 class="lbl">${e(u.education)}</h2>${timeline(c.education)}</section>

          <section class="t pubs" id="publications">
            <div class="pubs-head">
              <h2 class="lbl">${e(u.publications)}</h2>
              <a class="small-link" href="${x.links[0].url}" target="_blank" rel="noopener">${e(u.allPubs)} ${arrow}</a>
            </div>
            <ol class="pl" lang="en" dir="ltr">${x.pubs.map((p) => `
              <li>
                <span class="yr">${p.year}</span>
                <div>
                  <h3>${e(p.title)}</h3>
                  <p class="muted">${x.rich(p.authors)} — <em>${e(p.venue)}</em></p>
                </div>
                <div class="pbtns">${p.links.map((l) => `<a href="${l.url}">${e(l.label)}</a>`).join('')}</div>
              </li>`).join('')}</ol>
          </section>

          ${c.projects.map((p) => `
          <a class="t proj" href="${p.url}">
            <div class="proj-top"><span class="lbl">${e(u.projects)}</span>${arrow}</div>
            <h3>${e(p.title)}</h3>
            <p class="muted">${e(p.desc)}</p>
            <ul class="tags">${p.tags.map((t) => `<li>${e(t)}</li>`).join('')}</ul>
          </a>`).join('')}

          <footer class="t foot">
            <span>© ${x.year}</span>
            <span>${e(c.name)}</span>
          </footer>
        </div>
      </div>`;
    });
  </script>
</body>
</html>
