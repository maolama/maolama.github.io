<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    Site.init({
      id: 'bookshelf', theme: { h: 40, c: 0.08 }, icons: ['menu_book', 'format_quote'],

      shell: (c, x) => `
        <header class="top">
          <a href="#/" class="sig"><span class="ms">menu_book</span>${x.esc(x.lang === 'fa' ? `کتابخانه‌ی ${c.short}` : `${c.short}'s library`)}</a>
          <div class="ctrl">${x.paletteBtn()}${x.modeBtn()}${x.langBtn('btn text ripple')}</div>
        </header>
        <main id="view"></main>
        ${x.toolbar()}`,

      pages: {
        home: (c, x) => {
          const e = x.esc, u = c.ui;
          const books = x.nav.filter((n) => n.id !== 'home').map((n, i) => ({ ...n, o: [0, 40, 120, 200, 280][i], hh: [300, 270, 320, 250, 285][i], w: [74, 66, 82, 60, 70][i] }));
          return `
          <section class="hero">
            <div class="hero-text">
              <p class="label-l muted">${e(c.hello)}</p>
              <h1 class="display-m">${e(c.headline)}</h1>
            </div>
            <aside class="author">
              ${x.photoTag('author-photo', 120, 150)}
              <div><p class="label-m muted">${x.lang === 'fa' ? 'درباره‌ی نویسنده' : 'About the author'}</p><p class="body-m">${e(c.intro)}</p></div>
            </aside>
          </section>

          <section class="shelf-wrap">
            <div class="books">
              <span class="bookend" aria-hidden="true"></span>
              ${books.map((b) => `
                <a class="spine" href="${b.href}" style="--o:${b.o};--hh:${b.hh}px;--w:${b.w}px">
                  <span class="spine-title">${e(b.label)}</span><span class="ms">${b.icon}</span>
                </a>`).join('')}
              <span class="leaning" aria-hidden="true"></span>
              <svg class="plant" viewBox="0 0 80 120" aria-hidden="true"><path d="M40 70 C 20 50, 10 30, 18 10 C 30 25, 38 45, 40 70 Z"/><path d="M40 70 C 58 48, 70 34, 66 14 C 52 28, 44 46, 40 70 Z"/><path d="M40 72 C 30 60, 18 58, 6 62 C 16 72, 28 76, 40 72 Z"/><rect x="24" y="72" width="32" height="40" rx="6"/></svg>
            </div>
            <div class="plank"></div>
          </section>

          <section class="open-book" data-reveal>
            <div class="page left"><p class="label-m kicker">${e(u.now)}</p>${x.now()}</div>
            <div class="page right"><span class="ms quote-ic">format_quote</span><p class="title-l">${e(c.funFact)}</p><p class="body-s muted sigline">— ${e(c.short)}</p></div>
          </section>

          <section class="block" data-reveal><h2 class="headline-s block-title">${e(u.loves)}</h2>${x.hobbies()}</section>`;
        },
      },
    });
  </script>
</body>
</html>
