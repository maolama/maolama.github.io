<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    Site.init((c, x) => {
      const u = c.ui, e = x.esc;
      const num = (n) => n.toLocaleString(x.lang === 'fa' ? 'fa-IR' : 'en-US', { minimumIntegerDigits: 2 });
      const arrow = '<span class="arr" aria-hidden="true">↗</span>';
      let n = 0;
      const row = (id, title, body) => `
        <section class="row" id="${id}">
          <h2 class="label"><span class="n">${num(++n)}</span>${e(title)}</h2>
          <div class="body">${body}</div>
        </section>`;
      const table = (list) => `<ol class="table">${list.map((i) => `
        <li>
          <span class="c1">${e(i.when)}</span>
          <span class="c2"><b>${e(i.title)}</b><span class="org">${e(i.org)}</span></span>
          <span class="c3">${e(i.desc)}</span>
        </li>`).join('')}</ol>`;
      const nav = ['about', 'experience', 'research', 'publications', 'projects', 'contact'];

      return `
      <header class="head">
        <div class="topline">
          <span class="sq" aria-hidden="true"></span>
          <nav>${nav.map((k) => `<a href="#${k}">${e(u[k])}</a>`).join('')}</nav>
          ${x.langToggle('lang')}
        </div>
        <h1>${e(c.name)}</h1>
        <div class="meta">
          <img class="photo" src="${x.photo}" alt="${e(c.name)}" width="140" height="175">
          <div><span class="k">${e(u.role)}</span>${e(c.role)}</div>
          <div><span class="k">${e(u.location)}</span>${e(c.location)}</div>
          <div><span class="k">${e(u.contact)}</span><a dir="ltr" href="mailto:${x.email}">${x.email}</a></div>
          <div><span class="k">${e(u.links)}</span>${x.links.map((l) => `<a href="${l.url}" target="_blank" rel="noopener">${e(l.label)}</a>`).join('')}</div>
        </div>
      </header>

      <main>
        ${row('about', u.about, `<p class="lead">${e(c.tagline)}</p>${c.about.map((p) => `<p>${x.rich(p)}</p>`).join('')}`)}
        ${row('experience', u.experience, table(c.experience))}
        ${row('education', u.education, table(c.education))}
        ${row('research', u.research, `<div class="cols">${c.research.map((r, i) => `
          <div class="col"><span class="big-n">${num(i + 1)}</span><h3>${e(r.title)}</h3><p>${e(r.desc)}</p></div>`).join('')}</div>`)}
        ${row('publications', u.publications, `<ol class="table pubs" lang="en" dir="ltr">${x.pubs.map((p) => `
          <li>
            <span class="c1">${p.year}</span>
            <span class="c2 wide"><b>${e(p.title)}</b><span class="org">${x.rich(p.authors)}</span><i>${e(p.venue)}</i></span>
            <span class="c3 plinks">${p.links.map((l) => `<a href="${l.url}">${e(l.label)}</a>`).join('')}</span>
          </li>`).join('')}</ol>
          <a class="textlink" href="${x.links[0].url}" target="_blank" rel="noopener">${e(u.allPubs)} ${arrow}</a>`)}
        ${row('projects', u.projects, `<ol class="table projects">${c.projects.map((p, i) => `
          <li><a href="${p.url}">
            <span class="c1">${num(i + 1)}</span>
            <span class="c2"><b>${e(p.title)}</b><span class="org">${p.tags.map(e).join(' / ')}</span></span>
            <span class="c3">${e(p.desc)}</span>
            ${arrow}
          </a></li>`).join('')}</ol>`)}
        ${row('contact', u.contact, `
          <p class="lead">${e(u.contactText)}</p>
          <a class="mail" dir="ltr" href="mailto:${x.email}">${x.email}</a>
          <div><a class="cv" href="${x.cv}" target="_blank" rel="noopener">${e(u.cv)} ${arrow}</a></div>`)}
      </main>

      <footer class="foot">
        <span>© ${x.year} ${e(c.name)}</span>
        <a href="#">↑</a>
      </footer>`;
    });
  </script>
</body>
</html>
