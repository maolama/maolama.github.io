<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/material.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    const heroArt = (x) => `
      <svg class="art" viewBox="0 0 400 400" aria-hidden="true">
        <path class="s1" data-shape="12,.05,.03,.6" data-c="210,190,130"></path>
        <path class="s2" data-shape="4,.14,.06,.9" data-c="110,300,62"></path>
        <path class="s3" data-shape="8,.08,.05,.8" data-c="320,320,44"></path>
        <rect class="s4" x="270" y="40" width="120" height="48" rx="24"></rect>
        <g class="orbit"><circle cx="210" cy="30" r="10"></circle><circle cx="380" cy="190" r="6"></circle></g>
        <path class="spark" d="M70 90 Q74 74 90 70 Q74 66 70 50 Q66 66 50 70 Q66 74 70 90Z"></path>
        <circle class="ring" cx="210" cy="190" r="168"></circle>
      </svg>`;

    Site.init({
      icons: ['menu', 'add'],

      shell: (c, x) => `
        <nav class="rail" aria-label="Main">
          <a class="rail-mark" href="#/" aria-label="${x.esc(c.name)}">${x.esc(c.short.charAt(0))}</a>
          <a class="fab rail-fab ripple" href="#/contact" aria-label="${x.esc(c.ui.nav.contact)}"><span class="ms">mail</span></a>
          <div class="rail-items">
            ${x.nav.map((n) => `
              <a class="rail-item" data-nav="${n.id}" href="${n.href}">
                <span class="ind ripple"><span class="ms">${n.icon}</span></span>
                <span class="label-m">${x.esc(n.label)}</span>
              </a>`).join('')}
          </div>
          <div class="rail-foot">${x.themeBtn()}${x.langBtn('icon-btn lang ripple', true)}</div>
        </nav>

        <header class="topbar">
          <a class="rail-mark" href="#/">${x.esc(c.short.charAt(0))}</a>
          <span class="title-l">${x.esc(c.name)}</span>
          <span class="grow"></span>
          ${x.themeBtn()}${x.langBtn('icon-btn lang ripple', true)}
        </header>

        <div class="pane">
          <main id="view"></main>
          <footer class="foot body-s muted">© ${x.year} ${x.esc(c.name)}</footer>
        </div>

        <nav class="navbar" aria-label="Main">
          ${x.nav.filter((n) => n.id !== 'contact').map((n) => `
            <a class="rail-item" data-nav="${n.id}" href="${n.href}">
              <span class="ind ripple"><span class="ms">${n.icon}</span></span>
              <span class="label-m">${x.esc(n.label)}</span>
            </a>`).join('')}
        </nav>
        <a class="fab mobile-fab ripple" href="#/contact" aria-label="${x.esc(c.ui.nav.contact)}"><span class="ms">mail</span></a>`,

      pages: {
        home: (c, x) => {
          const e = x.esc, u = c.ui;
          return `
          <section class="hero" data-reveal>
            <div class="hero-text">
              <span class="chip assist hello"><span class="ms wave">waving_hand</span>${e(c.hello)}</span>
              <h1 class="display-m">${e(c.headline)}</h1>
              <p class="body-l muted">${e(c.intro)}</p>
              <div class="actions">
                <a class="btn filled lg ripple" href="#/projects">${e(u.seeProjects)}<span class="ms flip">arrow_forward</span></a>
                <a class="btn tonal lg ripple" href="#/resume">${e(u.readResume)}</a>
              </div>
            </div>
            <div class="hero-art">${heroArt(x)}</div>
          </section>

          <section class="block">
            <h2 class="title-l block-title">${e(u.whatIDo)}</h2>
            <div class="doing">
              ${c.doing.map((d, i) => `
                <article class="card filled doing-card" data-reveal style="--i:${i}">
                  <span class="icon-tile ${['', 'secondary', 'tertiary'][i]}"><span class="ms">${d.icon}</span></span>
                  <h3 class="title-l">${e(d.title)}</h3>
                  <p class="body-m muted">${e(d.desc)}</p>
                </article>`).join('')}
            </div>
          </section>

          <div class="split">
            <section class="block">
              <div class="block-head">
                <h2 class="title-l">${e(u.latest)}</h2>
                <a class="btn text ripple" href="#/writing">${e(u.allPosts)}<span class="ms flip">arrow_forward</span></a>
              </div>
              <div class="post-list">${c.posts.slice(0, 2).map(x.postCard).join('')}</div>
            </section>
            <aside class="block">
              <div class="card outlined profile" data-reveal style="--i:1">
                <div class="profile-top">
                  <img class="avatar" src="${x.photo}" alt="${e(c.name)}" width="112" height="112">
                  <div>
                    <h3 class="title-l">${e(c.name)}</h3>
                    <p class="body-m muted">${e(c.role)}</p>
                    <p class="body-s muted loc"><span class="ms">location_on</span>${e(c.location)}</p>
                  </div>
                </div>
                <hr class="divider">
                <h4 class="label-l now-title">${e(u.now)}</h4>
                <ul class="list now">
                  ${c.now.map((n) => `
                    <li class="list-item"><span class="ms lead">${n.icon}</span>
                      <span class="li-text"><span class="label-m muted">${e(n.label)}</span><span class="body-m">${e(n.text)}</span></span>
                    </li>`).join('')}
                </ul>
              </div>
            </aside>
          </div>

          <section class="block">
            <div class="block-head">
              <h2 class="title-l">${e(u.featured)}</h2>
              <a class="btn text ripple" href="#/projects">${e(u.allProjects)}<span class="ms flip">arrow_forward</span></a>
            </div>
            <div class="cards-grid">${c.projects.slice(0, 3).map(x.projectCard).join('')}</div>
          </section>`;
        },

        about: (c, x) => {
          const e = x.esc, u = c.ui;
          return `
          ${x.head('about')}
          <div class="about-grid">
            <div class="about-main">
              <div class="story" data-reveal>${c.story.map((p) => `<p class="body-l">${x.rich(p)}</p>`).join('')}</div>
              <blockquote class="card filled quote" data-reveal>
                <span class="ms">format_quote</span>
                <p class="headline-s">${e(c.quote)}</p>
              </blockquote>
              <h2 class="title-l block-title" data-reveal>${e(u.interests)}</h2>
              <div class="interests" data-reveal>
                ${c.interests.map((i, n) => `
                  <div class="interest" style="--i:${n}">
                    <span class="icon-tile ${['', 'secondary', 'tertiary'][n % 3]}"><span class="ms">${i.icon}</span></span>
                    <span class="label-l">${e(i.label)}</span>
                  </div>`).join('')}
              </div>
            </div>
            <aside class="card outlined about-side" data-reveal style="--i:1">
              <div class="photo-wrap">
                <svg viewBox="0 0 200 200" aria-hidden="true"><path data-shape="10,.06,.03,.5" data-c="100,100,86"></path></svg>
                <img src="${x.photo}" alt="${e(c.name)}" width="168" height="168">
              </div>
              <h2 class="title-l">${e(c.name)}</h2>
              <p class="body-m muted">${e(c.role)}</p>
              <ul class="list facts">
                ${c.facts.map((f) => `
                  <li class="list-item"><span class="ms lead">${f.icon}</span>
                    <span class="li-text"><span class="label-m muted">${e(f.k)}</span><span class="body-m">${e(f.v)}</span></span>
                  </li>`).join('')}
              </ul>
              <a class="btn tonal ripple" href="#/resume"><span class="ms">description</span>${e(u.readResume)}</a>
            </aside>
          </div>`;
        },
      },
    });
  </script>
</body>
</html>
