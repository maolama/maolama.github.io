<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    const art = `
      <svg class="art" viewBox="0 0 400 400" aria-hidden="true">
        <path class="s1" data-shape="12,.05,.03,.6" data-c="210,190,130"></path>
        <path class="s2" data-shape="4,.14,.06,.9" data-c="110,300,62"></path>
        <path class="s3" data-shape="8,.08,.05,.8" data-c="320,320,44"></path>
        <rect class="s4" x="270" y="40" width="120" height="48" rx="24"></rect>
        <g class="orbit"><circle cx="210" cy="30" r="10"></circle><circle cx="380" cy="190" r="6"></circle></g>
        <path class="spark" d="M70 90 Q74 74 90 70 Q74 66 70 50 Q66 66 50 70 Q66 74 70 90Z"></path>
        <circle class="ring" cx="210" cy="190" r="168"></circle>
      </svg>`;

    Site.init({
      id: 'workspace', theme: { h: 185, c: 0.1 },

      shell: (c, x) => `
        <nav class="rail" aria-label="Main">
          <a class="rail-mark" href="#/">${x.esc(c.initials)}</a>
          <a class="fab rail-fab ripple" href="#/contact" aria-label="${x.esc(c.ui.nav.contact)}"><span class="ms">mail</span></a>
          <div class="rail-items">${x.nav.map((n) => `
            <a class="rail-item" data-nav="${n.id}" href="${n.href}"><span class="ind ripple"><span class="ms">${n.icon}</span></span><span class="label-m">${x.esc(n.label)}</span></a>`).join('')}
          </div>
          <div class="rail-foot">${x.paletteBtn()}${x.modeBtn()}${x.langBtn('icon-btn lang ripple', true)}</div>
        </nav>
        <header class="topbar">
          <a class="rail-mark" href="#/">${x.esc(c.initials)}</a><span class="title-m">${x.esc(c.name)}</span><span class="grow"></span>
          ${x.paletteBtn()}${x.modeBtn()}${x.langBtn('icon-btn lang ripple', true)}
        </header>
        <div class="pane"><main id="view"></main></div>
        <nav class="navbar" aria-label="Main">${x.nav.filter((n) => n.id !== 'contact').map((n) => `
          <a class="rail-item" data-nav="${n.id}" href="${n.href}"><span class="ind ripple"><span class="ms">${n.icon}</span></span><span class="label-m">${x.esc(n.label)}</span></a>`).join('')}
        </nav>`,

      pages: {
        home: (c, x) => {
          const e = x.esc, u = c.ui;
          return `
          <section class="hero">
            <div class="hero-text">
              <span class="chip hello"><span class="ms wave">waving_hand</span>${e(c.hello)}</span>
              <h1 class="display-m">${e(c.headline)}</h1>
              <p class="body-l muted">${e(c.intro)}</p>
              <div class="actions"><a class="btn filled lg ripple" href="#/work">${e(u.seeWork)}<span class="ms flip">arrow_forward</span></a><a class="btn tonal lg ripple" href="#/journey">${e(u.readJourney)}</a></div>
            </div>
            <div class="hero-art">${art}</div>
          </section>
          <div class="dash">
            <div class="col-main">
              <h2 class="title-l block-title">${e(u.focus)}</h2>
              ${x.focus()}
              <h2 class="title-l block-title gap">${e(u.research)}</h2>
              <div class="work-grid">${x.researchCards()}</div>
            </div>
            <aside class="col-side">
              <div class="card profile" data-reveal>
                <div class="pt">${x.photoTag('avatar', 104, 104)}<div><h3 class="title-l">${e(c.name)}</h3><p class="body-s muted"><span class="ms">location_on</span>${e(c.location)}</p></div></div>
                <div class="socials">${x.socialLinks('icon-btn tonal ripple')}</div>
                <hr><h4 class="label-l">${e(u.now)}</h4>${x.now()}
              </div>
            </aside>
          </div>
          <section class="card loves" data-reveal><h2 class="title-l block-title">${e(u.loves)}</h2>${x.hobbies()}</section>`;
        },
      },
    });
  </script>
</body>
</html>
