<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/material.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    /* ---------- Interactive constellation (canvas) ---------- */
    let netColors = null;
    function readColors() {
      const cs = getComputedStyle(document.documentElement);
      netColors = { dot: cs.getPropertyValue('--primary').trim(), line: cs.getPropertyValue('--outline').trim() };
    }
    function constellation(canvas) {
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const mouse = { x: -9999, y: -9999 };
      let w = 0, h = 0, pts = [];
      readColors();
      function size() {
        const r = canvas.getBoundingClientRect();
        w = r.width; h = r.height;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const n = Math.round(Math.min(120, (w * h) / 10000));
        pts = Array.from({ length: n }, () => ({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, r: Math.random() * 1.6 + 1,
        }));
      }
      size();
      new ResizeObserver(size).observe(canvas);
      canvas.parentElement.addEventListener('pointermove', (e) => {
        const r = canvas.getBoundingClientRect();
        mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
      });
      canvas.parentElement.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });

      function frame() {
        if (!canvas.isConnected) return;
        ctx.clearRect(0, 0, w, h);
        for (const p of pts) {
          if (!Site.reduced) { p.x += p.vx; p.y += p.vy; }
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
          const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
          if (d < 120 && d > 0) { p.x += dx / d * 0.8; p.y += dy / d * 0.8; }
        }
        ctx.lineWidth = 1;
        for (let i = 0; i < pts.length; i++) {
          for (let j = i + 1; j < pts.length; j++) {
            const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
            if (d < 130) {
              ctx.globalAlpha = (1 - d / 130) * 0.45;
              ctx.strokeStyle = netColors.line;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            }
          }
          const p = pts[i], dm = Math.hypot(p.x - mouse.x, p.y - mouse.y);
          if (dm < 200) {
            ctx.globalAlpha = (1 - dm / 200) * 0.8;
            ctx.strokeStyle = netColors.dot;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = netColors.dot;
        for (const p of pts) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    /* ---------- Typewriter ---------- */
    function typewriter(el, words) {
      if (Site.reduced) { el.textContent = words[0]; return; }
      let w = 0, i = 0, deleting = false;
      (function tick() {
        if (!el.isConnected) return;
        const word = words[w];
        i += deleting ? -1 : 1;
        el.textContent = word.slice(0, i);
        let delay = deleting ? 45 : 90;
        if (!deleting && i === word.length) { deleting = true; delay = 1600; }
        else if (deleting && i === 0) { deleting = false; w = (w + 1) % words.length; delay = 300; }
        setTimeout(tick, delay);
      })();
    }

    /* ---------- Tab indicator ---------- */
    function moveIndicator() {
      const ind = document.querySelector('.tab-ind');
      const tab = document.querySelector('.tabs .tab.active');
      if (!ind || !tab) return;
      ind.style.width = tab.offsetWidth - 24 + 'px';
      ind.style.transform = `translateX(${tab.offsetLeft + 12}px)`;
      tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    Site.init({
      icons: ['expand_more', 'auto_awesome'],

      shell: (c, x) => `
        <header class="appbar" id="appbar">
          <div class="appbar-row">
            <a class="brand" href="#/"><span class="logo"><span class="ms fill">auto_awesome</span></span><span class="title-l">${x.esc(c.name)}</span></a>
            <nav class="tabs" aria-label="Main">
              ${x.nav.map((n) => `<a class="tab ripple" data-nav="${n.id}" href="${n.href}"><span class="ms">${n.icon}</span><span class="label-l">${x.esc(n.label)}</span></a>`).join('')}
              <span class="tab-ind" aria-hidden="true"></span>
            </nav>
            <div class="appbar-actions">${x.langBtn('btn text ripple lang-btn')}${x.themeBtn()}</div>
          </div>
        </header>
        <main id="view"></main>
        <footer class="footer">
          <div class="footer-in">
            <span class="body-m muted">© ${x.year} ${x.esc(c.name)}</span>
            <div class="footer-links">${x.links.map((l) => `<a class="icon-btn ripple" href="${l.url}" target="_blank" rel="noopener" title="${x.esc(l.label)}"><span class="ms">${l.icon}</span></a>`).join('')}</div>
          </div>
        </footer>
        <a class="fab contact-fab ripple" href="#/contact"><span class="ms">chat</span><span class="fab-label">${x.esc(c.ui.nav.contact)}</span></a>`,

      mount() {
        const bar = document.getElementById('appbar');
        window.onscroll = () => bar.classList.toggle('scrolled', scrollY > 8);
        window.onresize = moveIndicator;
        document.fonts.ready.then(moveIndicator);
      },

      after(page) {
        moveIndicator();
        if (page !== 'home') return;
        const canvas = document.querySelector('.net');
        if (canvas) constellation(canvas);
        const typed = document.querySelector('.typed');
        if (typed) typewriter(typed, JSON.parse(typed.dataset.words));
      },

      onTheme() { readColors(); },

      pages: {
        home: (c, x) => {
          const e = x.esc, u = c.ui;
          return `
          <section class="hero">
            <canvas class="net" aria-hidden="true"></canvas>
            <div class="hero-in">
              <span class="chip assist hero-chip"><span class="ms">location_on</span>${e(c.location)}</span>
              <h1 class="display-l">${e(c.hello)}</h1>
              <p class="headline-m typer">${e(u.iam)} <span class="typed" data-words='${e(JSON.stringify(c.roles))}'></span><span class="caret" aria-hidden="true"></span> ${e(u.iamEnd)}</p>
              <p class="body-l muted intro">${e(c.headline)}</p>
              <div class="actions">
                <a class="btn filled lg ripple" href="#/projects">${e(u.seeProjects)}<span class="ms flip">arrow_forward</span></a>
                <a class="btn outlined lg ripple" href="#/resume">${e(u.readResume)}</a>
              </div>
            </div>
            <span class="ms scroll-cue" aria-hidden="true">expand_more</span>
          </section>

          <section class="wrap stats">
            ${x.stats.map((s, i) => `
              <div class="stat" data-reveal style="--i:${i}">
                <span class="display-m stat-n" data-count="${s.n}">0</span><span class="stat-plus">+</span>
                <span class="label-l muted">${e(s.label)}</span>
              </div>`).join('')}
          </section>

          <section class="wrap sec">
            <h2 class="headline-s sec-h" data-reveal>${e(u.whatIDo)}</h2>
            <div class="doing">
              ${c.doing.map((d, i) => `
                <article class="card outlined doing-card" data-reveal style="--i:${i}">
                  <span class="icon-tile ${['', 'secondary', 'tertiary'][i]}"><span class="ms">${d.icon}</span></span>
                  <h3 class="title-l">${e(d.title)}</h3>
                  <p class="body-m muted">${e(d.desc)}</p>
                </article>`).join('')}
            </div>
          </section>

          <section class="wrap sec mosaic">
            <a class="card filled ripple feature-post" href="#/writing/${c.posts[0].slug}" data-reveal>
              <span class="label-m kicker">${e(u.latest)}</span>
              <h3 class="headline-m">${e(c.posts[0].title)}</h3>
              <p class="body-l muted">${e(c.posts[0].excerpt)}</p>
              <span class="btn tonal">${e(u.readWriting)}<span class="ms flip">arrow_forward</span></span>
            </a>
            <div class="card outlined now-card" data-reveal style="--i:1">
              <div class="me">
                <img src="${x.photo}" alt="${e(c.name)}" width="88" height="88">
                <div><h3 class="title-l">${e(c.short)}</h3><p class="body-m muted">${e(c.role)}</p></div>
              </div>
              <h4 class="label-m kicker">${e(u.now)}</h4>
              <ul class="list">
                ${c.now.map((n) => `<li class="list-item"><span class="icon-tile secondary sm"><span class="ms">${n.icon}</span></span>
                  <span class="li-text"><span class="label-m muted">${e(n.label)}</span><span class="body-m">${e(n.text)}</span></span></li>`).join('')}
              </ul>
            </div>
          </section>

          <section class="wrap sec">
            <div class="sec-head">
              <h2 class="headline-s">${e(u.featured)}</h2>
              <a class="btn text ripple" href="#/projects">${e(u.allProjects)}<span class="ms flip">arrow_forward</span></a>
            </div>
            <div class="cards-grid">${c.projects.slice(0, 3).map(x.projectCard).join('')}</div>
          </section>`;
        },

        about: (c, x) => {
          const e = x.esc, u = c.ui;
          return `
            ${x.head('about')}
            <div class="about-grid">
              <aside class="card filled id-card" data-reveal>
                <img class="id-photo" src="${x.photo}" alt="${e(c.name)}" width="220" height="260">
                <h2 class="title-l">${e(c.name)}</h2>
                <p class="body-m muted">${e(c.role)}</p>
                <div class="id-links">${x.links.map((l) => `<a class="icon-btn tonal ripple" href="${l.url}" target="_blank" rel="noopener" title="${e(l.label)}"><span class="ms">${l.icon}</span></a>`).join('')}</div>
              </aside>
              <div>
                <div class="story" data-reveal>${c.story.map((p) => `<p class="body-l">${x.rich(p)}</p>`).join('')}</div>
                <blockquote class="quote" data-reveal><p class="headline-s">${e(c.quote)}</p></blockquote>
                <h2 class="title-l sub-h" data-reveal>${e(u.glance)}</h2>
                <div class="facts" data-reveal>
                  ${c.facts.map((f) => `<div class="fact card outlined"><span class="ms">${f.icon}</span><span class="label-m muted">${e(f.k)}</span><span class="title-m">${e(f.v)}</span></div>`).join('')}
                </div>
                <h2 class="title-l sub-h" data-reveal>${e(u.interests)}</h2>
                <div class="chips interests" data-reveal>
                  ${c.interests.map((i) => `<span class="chip assist lg-chip"><span class="ms">${i.icon}</span>${e(i.label)}</span>`).join('')}
                </div>
              </div>
            </div>`;
        },
      },
    });
  </script>
</body>
</html>
