<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    const TOKENS = {
      en: ['judge', 'bias', 'long', 'short', 'DPO', 'eval', 'prompt', 'answer', 'Persian', 'tokens', 'fair?', 'LLM'],
      fa: ['داور', 'سوگیری', 'طولانی', 'کوتاه', 'DPO', 'ارزیابی', 'پرسش', 'پاسخ', 'فارسی', 'توکن', 'منصف؟', 'LLM'],
    };
    const FACTS = {
      en: [[8, '+', 'semesters as a TA'], [3, '', 'research projects'], [3, '', 'years as a developer']],
      fa: [[8, '+', 'ترم دستیار آموزشی'], [3, '', 'پروژه‌ی پژوهشی'], [3, '', 'سال توسعه‌ی نرم‌افزار']],
    };
    let colors = {};
    function resolve(v) {
      const el = document.createElement('i');
      el.style.color = `var(${v})`;
      document.body.appendChild(el);
      const col = getComputedStyle(el).color;
      el.remove();
      const cx = document.createElement('canvas').getContext('2d');
      cx.fillStyle = '#888'; cx.fillStyle = col; cx.fillRect(0, 0, 1, 1);
      const [r, g, b] = cx.getImageData(0, 0, 1, 1).data;
      return `${r},${g},${b}`;
    }
    const readColors = () => { colors = { p: resolve('--primary'), o: resolve('--outline'), s: resolve('--surface-container-high'), t: resolve('--on-surface') }; };

    function tokenGraph(canvas, words) {
      const ctx = canvas.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
      const mouse = { x: -9999, y: -9999 };
      let W = 0, H = 0, nodes = [];
      readColors();
      function size() {
        const r = canvas.getBoundingClientRect();
        W = r.width; H = r.height;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.font = '500 13px "Roboto Flex", Vazirmatn, sans-serif';
        const n = Math.min(words.length * 3, Math.round(W * H / 16000));
        nodes = Array.from({ length: n }, (_, i) => {
          const text = words[i % words.length];
          return { text, w: ctx.measureText(text).width + 22, x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3 };
        });
      }
      size();
      new ResizeObserver(size).observe(canvas);
      canvas.parentElement.addEventListener('pointermove', (e) => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
      canvas.parentElement.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });
      (function frame() {
        if (!canvas.isConnected) return;
        ctx.clearRect(0, 0, W, H);
        for (const n of nodes) {
          if (!Site.reduced) { n.x += n.vx; n.y += n.vy; }
          if (n.x < 0 || n.x > W) n.vx *= -1;
          if (n.y < 0 || n.y > H) n.vy *= -1;
          const dx = mouse.x - n.x, dy = mouse.y - n.y, d = Math.hypot(dx, dy);
          if (d < 180 && d > 40) { n.x += dx / d * .5; n.y += dy / d * .5; }
          n.near = d < 180;
        }
        for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 150) {
            ctx.strokeStyle = `rgba(${a.near && b.near ? colors.p : colors.o},${(1 - d / 150) * (a.near && b.near ? .8 : .35)})`;
            ctx.lineWidth = a.near && b.near ? 1.5 : 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for (const n of nodes) {
          ctx.fillStyle = n.near ? `rgb(${colors.p})` : `rgba(${colors.s},.9)`;
          ctx.beginPath(); ctx.roundRect ? ctx.roundRect(n.x - n.w / 2, n.y - 13, n.w, 26, 13) : ctx.rect(n.x - n.w / 2, n.y - 13, n.w, 26); ctx.fill();
          ctx.fillStyle = n.near ? '#fff' : `rgba(${colors.t},.7)`;
          ctx.fillText(n.text, n.x, n.y + 1);
        }
        requestAnimationFrame(frame);
      })();
    }

    function typewriter(el, words) {
      if (Site.reduced) { el.textContent = words[0]; return; }
      let w = 0, i = 0, del = false;
      (function tick() {
        if (!el.isConnected) return;
        i += del ? -1 : 1;
        el.textContent = words[w].slice(0, i);
        let t = del ? 40 : 85;
        if (!del && i === words[w].length) { del = true; t = 1500; }
        else if (del && i === 0) { del = false; w = (w + 1) % words.length; t = 280; }
        setTimeout(tick, t);
      })();
    }

    function moveIndicator() {
      const ind = document.querySelector('.tab-ind'), tab = document.querySelector('.tabs .tab.active');
      if (!ind || !tab) return;
      ind.style.width = tab.offsetWidth - 24 + 'px';
      ind.style.transform = `translateX(${tab.offsetLeft + 12}px)`;
    }

    function countUp(scope, lang) {
      const io = new IntersectionObserver((es) => es.forEach((e) => {
        if (!e.isIntersecting) return;
        io.unobserve(e.target);
        const el = e.target, n = +el.dataset.count, t0 = performance.now();
        const fmt = (v) => Math.round(v).toLocaleString(lang === 'fa' ? 'fa-IR' : 'en-US');
        (function step(t) { const p = Math.min(1, (t - t0) / 1100); el.textContent = fmt(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); })(t0);
      }));
      scope.querySelectorAll('[data-count]').forEach((el) => io.observe(el));
    }

    Site.init({
      id: 'constellation', theme: { h: 280, c: 0.13 }, icons: ['hub'],

      shell: (c, x) => `
        <header class="appbar" id="appbar">
          <a class="brand-l" href="#/"><span class="logo"><span class="ms">hub</span></span><span class="title-m">${x.esc(c.name)}</span></a>
          <nav class="tabs" aria-label="Main">${x.nav.map((n) => `<a class="tab ripple" data-nav="${n.id}" href="${n.href}"><span class="ms">${n.icon}</span><span class="label-l">${x.esc(n.label)}</span></a>`).join('')}<span class="tab-ind"></span></nav>
          <div class="acts">${x.paletteBtn()}${x.modeBtn()}${x.langBtn('btn text ripple')}</div>
        </header>
        <main id="view"></main>
        <footer class="foot"><span class="body-s muted">© ${x.year} ${x.esc(c.name)}</span><span>${x.socialLinks()}</span></footer>`,

      mount() {
        const bar = document.getElementById('appbar');
        window.onscroll = () => bar.classList.toggle('scrolled', scrollY > 8);
        window.onresize = moveIndicator;
        document.fonts.ready.then(moveIndicator);
      },
      onTheme: () => readColors(),
      after(page, c, x) {
        moveIndicator();
        if (page !== 'home') return;
        tokenGraph(document.querySelector('.net'), TOKENS[x.lang]);
        typewriter(document.querySelector('.typed'), c.roles);
        countUp(document.getElementById('view'), x.lang);
      },

      pages: {
        home: (c, x) => {
          const e = x.esc, u = c.ui;
          return `
          <section class="hero">
            <canvas class="net" aria-hidden="true"></canvas>
            <div class="hero-in">
              <span class="chip hero-chip"><span class="ms">location_on</span>${e(c.location)}</span>
              <h1 class="display-l">${e(c.hello)}</h1>
              <p class="headline-s typer">${e(u.iam)} <span class="typed"></span><span class="caret"></span> ${e(u.iamEnd)}</p>
              <p class="body-l muted lead">${e(c.headline)}</p>
              <div class="actions"><a class="btn filled lg ripple" href="#/work">${e(u.seeWork)}<span class="ms flip">arrow_forward</span></a><a class="btn outlined lg ripple" href="#/about">${e(u.moreAbout)}</a></div>
            </div>
          </section>
          <section class="wrap facts">${FACTS[x.lang].map(([n, plus, l], i) => `
            <div class="fact" data-reveal style="--i:${i}"><span class="display-m"><span data-count="${n}">0</span>${plus}</span><span class="label-l muted">${e(l)}</span></div>`).join('')}
          </section>
          <section class="wrap sec"><h2 class="headline-s sec-h">${e(u.focus)}</h2>${x.focus()}</section>
          <section class="wrap sec mosaic">
            <div class="me card" data-reveal>
              ${x.photoTag('me-photo', 96, 96)}
              <h3 class="title-l">${e(c.short)}</h3><p class="body-m muted">${e(c.role)}</p>
              <h4 class="label-m kicker">${e(u.now)}</h4>${x.now()}
            </div>
            <div class="work-grid">${x.researchCards()}</div>
          </section>
          <section class="wrap sec" data-reveal><h2 class="headline-s sec-h">${e(u.loves)}</h2>${x.hobbies()}</section>`;
        },
      },
    });
  </script>
</body>
</html>
