<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-base="../../">
  <div id="app"></div>
  <script src="../../assets/js/content.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    // [n, amp, left%, top%, size, depth, colour role]
    const SHAPES = [
      [12, .06, 76, 10, 240, 1, 'primary-container'], [4, .16, 4, 60, 150, 1.6, 'tertiary-container'],
      [8, .09, 88, 66, 110, 2.2, 'secondary-container'], [0, 0, 62, 6, 46, 2.8, 'primary'], [6, .12, 50, 82, 80, 1.3, 'tertiary-container'],
    ];
    const words = (s) => s.split(' ').map((w, i) => `<span class="w" style="--i:${i}"><span>${w}</span></span>`).join(' ');

    Site.init({
      id: 'story', theme: { h: 40, c: 0.13 }, icons: ['arrow_downward'],

      shell: (c, x) => `
        <header class="top">
          <a class="mono ripple" href="#/">${x.esc(c.short)}</a>
          <div class="top-actions">${x.paletteBtn('icon-btn tonal ripple')}${x.modeBtn('icon-btn tonal ripple')}${x.langBtn('btn tonal ripple')}</div>
        </header>
        <main id="view"></main>
        <footer class="footer"><div class="footer-in">
          <p class="headline-s">${x.esc(c.name)}</p>
          <div class="chips">${x.socialLinks('chip ripple', true)}</div>
          <p class="body-s muted">© ${x.year} · ${x.esc(c.ui.rights)}</p>
        </div></footer>
        ${x.toolbar()}`,

      mount() {
        const bar = document.getElementById('toolbar'), root = document.documentElement;
        let last = scrollY;
        window.onscroll = () => {
          const y = scrollY;
          if (y > last + 4 && y > 200) bar.classList.add('hidden');
          if (y < last - 4) bar.classList.remove('hidden');
          last = y;
          root.style.setProperty('--sy', y);
        };
        window.onpointermove = (e) => {
          root.style.setProperty('--mx', (e.clientX / innerWidth - 0.5).toFixed(3));
          root.style.setProperty('--my', (e.clientY / innerHeight - 0.5).toFixed(3));
        };
      },

      pages: {
        home: (c, x) => {
          const e = x.esc, u = c.ui;
          const kw = c.keywords.map((k) => `<span>${e(k)}</span><span class="ms star">north_east</span>`).join('');
          return `
          <section class="hero">
            <div class="shapes" aria-hidden="true">${SHAPES.map(([n, amp, l, t, s, d, col]) => `
              <div class="shape" style="left:${l}%;top:${t}%;width:${s}px;--d:${d}"><svg viewBox="0 0 100 100"><path style="fill:var(--${col})" ${n ? `data-shape="${n},${amp},.04,.5" data-c="50,50,40"` : 'd="M10 50a40 40 0 1 0 80 0a40 40 0 1 0-80 0"'}></path></svg></div>`).join('')}
            </div>
            <p class="title-l hello"><span class="ms wave">waving_hand</span>${e(c.hello)}</p>
            <h1 class="hero-title">${words(e(c.headline))}</h1>
            <div class="hero-foot">
              <p class="body-l muted">${e(c.intro)}</p>
              <a class="btn filled lg ripple" href="#/about">${e(u.moreAbout)}<span class="ms flip">arrow_forward</span></a>
            </div>
            <span class="ms cue" aria-hidden="true">arrow_downward</span>
          </section>

          <div class="marquee" aria-hidden="true"><div class="track">${kw}${kw}</div></div>

          <section class="sec in-short card" data-reveal>
            ${x.photoTag('me')}
            <div>
              <p class="label-m kicker">${e(u.now)}</p>
              ${x.now()}
              <a class="btn text ripple" href="#/about">${e(u.moreAbout)}<span class="ms flip">arrow_forward</span></a>
            </div>
          </section>

          <section class="sec">
            <h2 class="display-s sec-title" data-reveal>${e(u.focus)}</h2>
            <div class="rows">${c.focus.map((d, i) => `
              <article class="row" data-reveal style="--i:${i}">
                <span class="row-n">${x.num(i + 1, 2)}</span>
                <div><h3 class="headline-s">${e(d.title)}</h3><p class="body-l muted">${e(d.desc)}</p></div>
                <span class="row-ic"><span class="ms">${d.icon}</span></span>
              </article>`).join('')}
            </div>
          </section>

          <section class="sec">
            <div class="sec-head" data-reveal><h2 class="display-s">${e(u.research)}</h2><a class="btn outlined ripple" href="#/work">${e(u.seeWork)}</a></div>
            <div class="work-grid">${x.researchCards()}</div>
          </section>

          <section class="sec" data-reveal>
            <h2 class="display-s sec-title">${e(u.loves)}</h2>
            ${x.hobbies()}
          </section>

          <section class="sec">
            <div class="cta" data-reveal>
              <svg class="cta-shape" viewBox="0 0 100 100" aria-hidden="true"><path data-shape="12,.07,.03,.4" data-c="50,50,40"></path></svg>
              <h2 class="display-m">${e(u.contactTitle)}</h2>
              <p class="body-l">${e(u.contactText)}</p>
              <a class="btn filled lg ripple" href="#/contact"><span class="ms flip">send</span>${e(u.getInTouch)}</a>
            </div>
          </section>`;
        },
      },
    });
  </script>
</body>
</html>
