<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Developer illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2ecff"/><stop offset="1" stop-color="#abc6f7"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3366c4"/><stop offset="1" stop-color="#1e4189"/></linearGradient>
    <linearGradient id="lap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a55"/><stop offset="1" stop-color="#1c273b"/></linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Windows-style editor window with Java code -->
  <g transform="translate(30 58)">
    <rect width="150" height="104" rx="8" fill="#ffffff"/>
    <rect width="150" height="20" rx="8" fill="#eef2f9"/><rect y="12" width="150" height="8" fill="#eef2f9"/>
    <g stroke="#5b6b86" stroke-width="1.6" stroke-linecap="round">
      <line x1="108" y1="10" x2="114" y2="10"/>
      <rect x="122" y="7" width="6" height="6" fill="none"/>
      <path d="M136 7 l6 6 M142 7 l-6 6"/>
    </g>
    <text font-family="Consolas, 'Cascadia Code', ui-monospace, monospace" font-size="9.5" font-weight="600">
      <tspan x="10" y="36" fill="#c2410c">public class</tspan><tspan fill="#1e3a8a"> Me {</tspan>
      <tspan x="18" y="51" fill="#c2410c">void</tspan><tspan fill="#0f766e"> code</tspan><tspan fill="#1e3a8a">() {</tspan>
      <tspan x="26" y="66" fill="#1e3a8a">coffee.</tspan><tspan fill="#0f766e">sip</tspan><tspan fill="#1e3a8a">();</tspan>
      <tspan x="26" y="81" fill="#1e3a8a">build.</tspan><tspan fill="#0f766e">run</tspan><tspan fill="#1e3a8a">();</tspan>
      <tspan x="18" y="96" fill="#1e3a8a">} }</tspan>
    </text>
  </g>

  <!-- body -->
  <path d="M86 400 C 92 320, 140 288, 200 288 C 260 288, 308 320, 314 400 Z" fill="url(#hood)"/>
  <path d="M174 290 Q200 316 226 290" fill="#f0c2a0"/>
  <path d="M170 292 L200 322 L230 292" fill="none" stroke="#1a3672" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- neck, ears, head -->
  <path d="M184 250 L184 292 Q200 302 216 292 L216 250 Z" fill="#e6b08b"/>
  <ellipse cx="148" cy="200" rx="9" ry="14" fill="#eab894"/>
  <ellipse cx="252" cy="200" rx="9" ry="14" fill="#eab894"/>
  <path d="M148 186 C 148 140, 172 124, 200 124 C 228 124, 252 140, 252 186 C 252 222, 240 256, 200 262 C 160 256, 148 222, 148 186 Z" fill="#f3c9a6"/>

  <!-- simple short hair -->
  <path d="M146 192 C 140 136, 168 112, 202 112 C 238 112, 262 138, 254 192 C 250 172, 246 160, 238 152 C 214 156, 186 150, 166 140 C 158 152, 150 168, 146 192 Z" fill="#2e241f"/>
  <path d="M172 132 C 190 122, 214 120, 232 128" fill="none" stroke="#4a3b33" stroke-width="4" stroke-linecap="round" opacity=".7"/>

  <!-- face -->
  <path d="M166 180 Q177 175 188 179" fill="none" stroke="#3a2d26" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M212 179 Q223 175 234 180" fill="none" stroke="#3a2d26" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="177" cy="196" rx="5" ry="6" fill="#2b211c"/>
  <ellipse cx="223" cy="196" rx="5" ry="6" fill="#2b211c"/>
  <circle cx="179" cy="194" r="1.6" fill="#ffffff"/>
  <circle cx="225" cy="194" r="1.6" fill="#ffffff"/>
  <path d="M200 202 Q196 218 200 222 Q204 223 207 220" fill="none" stroke="#d99a76" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="166" cy="216" rx="9" ry="5" fill="#f19a8a" opacity=".25"/>
  <ellipse cx="234" cy="216" rx="9" ry="5" fill="#f19a8a" opacity=".25"/>
  <path d="M186 234 Q200 244 214 234" fill="none" stroke="#9a4a33" stroke-width="3.5" stroke-linecap="round"/>

  <!-- laptop (back) with a Windows logo -->
  <path d="M106 400 L126 324 L274 324 L294 400 Z" fill="url(#lap)"/>
  <rect x="126" y="320" width="148" height="7" rx="3.5" fill="#4b5b78"/>
  <g transform="translate(184 348) skewY(-4)" fill="#4f9cff">
    <rect width="15" height="14" rx="1"/><rect x="17" width="15" height="14" rx="1"/>
    <rect y="16" width="15" height="14" rx="1"/><rect x="17" y="16" width="15" height="14" rx="1"/>
  </g>

  <!-- Java coffee cup -->
  <g transform="translate(304 316)">
    <path d="M12 -10 q-7 -9 0 -18 q7 -9 0 -18" fill="none" stroke="#e76f00" stroke-width="3.5" stroke-linecap="round" opacity=".9"/>
    <path d="M24 -10 q-7 -9 0 -18" fill="none" stroke="#e76f00" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>
    <path d="M0 0 h40 l-4 38 q-1 6 -7 6 h-18 q-6 0 -7 -6 Z" fill="#ffffff"/>
    <path d="M40 8 q14 0 13 12 q-1 12 -15 12" fill="none" stroke="#ffffff" stroke-width="5"/>
    <text x="20" y="27" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#1565c0">Java</text>
  </g>
</svg>
