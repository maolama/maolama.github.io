<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Options</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f3f3f1; --card: #fff; --text: #111; --muted: #666; --line: #e2e2de; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e10; --card: #18181b; --text: #f2f2f2; --muted: #a0a0a8; --line: #2a2a2f; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 "Inter", "Vazirmatn", system-ui, sans-serif; }
    header { max-width: 1240px; margin: 0 auto; padding: 48px 16px 24px; display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
    h1 { margin: 0 0 6px; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -.03em; }
    header p { margin: 0; color: var(--muted); max-width: 620px; }
    .seg { display: inline-flex; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
    .seg button { border: 0; background: none; color: var(--muted); font: 500 .92rem "Inter", "Vazirmatn", sans-serif; padding: 7px 18px; border-radius: 999px; cursor: pointer; }
    .seg button.on { background: var(--text); color: var(--bg); }
    main { max-width: 1240px; margin: 0 auto; padding: 8px 16px 64px; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .frame { position: relative; aspect-ratio: 1280 / 820; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--bg); }
    .frame iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 820px; border: 0; transform-origin: 0 0; pointer-events: none; }
    .frame a { position: absolute; inset: 0; }
    .info { padding: 20px 22px 22px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
    .letter { grid-row: span 2; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--text); color: var(--bg); font-weight: 700; }
    .info h2 { margin: 0; font-size: 1.15rem; }
    .info p { margin: 0; color: var(--muted); font-size: .95rem; }
    .open { grid-column: 2; margin-top: 10px; font-weight: 600; color: var(--text); text-decoration: none; }
    .open:hover { text-decoration: underline; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Choose a design</h1>
      <p>Three personal-website directions in Material 3. Each has Home, About, Projects, Writing, Resume and Contact pages, in English (LTR) and Persian (RTL), with light and dark themes. Click a preview to open it.</p>
    </div>
    <div class="seg" role="group" aria-label="Preview language">
      <button data-l="en" class="on">English</button>
      <button data-l="fa" lang="fa">فارسی</button>
    </div>
  </header>

  <main id="grid"></main>

  <script>
    const designs = [
      { id: 'workspace', letter: 'A', name: 'Workspace', desc: 'App-like Material 3: navigation rail (bottom bar on phones), slowly morphing Material shapes, calm teal tones.' },
      { id: 'constellation', letter: 'B', name: 'Constellation', desc: 'Top app bar with sliding tabs, an interactive particle network that reacts to your mouse, a typing headline and animated counters. Indigo.' },
      { id: 'story', letter: 'C', name: 'Story', desc: 'One long scrolling story: word-by-word headline, parallax shapes, a moving keyword band and a floating toolbar. Warm terracotta.' },
    ];
    let lang = 'en';
    const grid = document.getElementById('grid');

    function render() {
      grid.innerHTML = designs.map((d) => {
        const url = `designs/${d.id}/?lang=${lang}`;
        return `
        <article class="card">
          <div class="frame"><iframe src="${url}" title="${d.name} preview" loading="lazy" tabindex="-1"></iframe><a href="${url}" aria-label="Open ${d.name}"></a></div>
          <div class="info">
            <span class="letter">${d.letter}</span>
            <h2>${d.name}</h2>
            <p>${d.desc}</p>
            <a class="open" href="${url}">Open full page →</a>
          </div>
        </article>`;
      }).join('');
      fit();
    }
    function fit() {
      document.querySelectorAll('.frame').forEach((f) => {
        f.querySelector('iframe').style.transform = `scale(${f.clientWidth / 1280})`;
      });
    }
    document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
      lang = b.dataset.l;
      document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
      render();
    }));
    addEventListener('resize', fit);
    render();
  </script>
</body>
</html>
