<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohammad Ali Olama</title>
  <meta name="description" content="Mohammad Ali Olama: LLM researcher, backend team lead, bookworm and gamer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Vazirmatn:wght@300..800&display=swap" rel="stylesheet">

<body data-base="">
  <div id="app"></div>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/site.js"></script>
  <script>
    /* ============ Journey road (from the Path design) ============ */
    const ym = (s) => {
      if (!s) { const d = new Date(); return d.getFullYear() + d.getMonth() / 12; }
      const [y, m] = s.split('-').map(Number);
      return y + (m ? (m - 1) / 12 : 0);
    };
    const yr = (t) => Math.floor(t + 1e-6);
    function periods(c) {
      const ps = c.journey.map((j) => {
        const d = SITE.timeline[j.id];
        return { j, from: ym(d.from), to: ym(d.to), open: !d.to, kind: d.kind };
      }).sort((a, b) => a.from - b.from);
      const ends = [];
      ps.forEach((p) => {
        let l = ends.findIndex((e) => e <= p.from + 1e-6);
        if (l < 0) l = ends.length;
        ends[l] = p.to; p.lane = l;
      });
      const ov = [];
      for (let i = 0; i < ps.length; i++) for (let k = i + 1; k < ps.length; k++) {
        const s = Math.max(ps[i].from, ps[k].from), e = Math.min(ps[i].to, ps[k].to);
        if (e - s > 0.05) ov.push({ s, e, a: ps[i], b: ps[k] });
      }
      return { ps, ov };
    }
    function pointAtY(path, y) {
      const L = path.getTotalLength();
      let lo = 0, hi = L;
      for (let i = 0; i < 22; i++) { const mid = (lo + hi) / 2; path.getPointAtLength(mid).y < y ? (lo = mid) : (hi = mid); }
      return path.getPointAtLength(lo);
    }
    function layoutRoad() {
      const wrap = document.getElementById('road');
      if (!wrap || !wrap._d) return;
      const { ps, ov } = wrap._d;
      const W = wrap.clientWidth, narrow = W < 760;
      const rtl = document.documentElement.dir === 'rtl', sgn = rtl ? -1 : 1;
      const gap = narrow ? 30 : 124, maxLane = Math.max(...ps.map((p) => p.lane));
      const x0 = narrow ? (rtl ? W - 26 : 26) : W / 2 - sgn * gap * maxLane / 2;
      const laneX = (l) => x0 + sgn * l * gap;
      const cards = [...wrap.querySelectorAll('.stop')];
      const place = (el, side) => {
        let a, b;
        if (narrow) { const edge = laneX(maxLane) + sgn * 30; [a, b] = rtl ? [0, edge] : [edge, W]; }
        else if (side === 0) { const edge = x0 - sgn * 46; [a, b] = rtl ? [edge, W] : [0, edge]; }
        else { const edge = laneX(maxLane) + sgn * 46; [a, b] = rtl ? [0, edge] : [edge, W]; }
        el.style.left = a + 'px'; el.style.width = (b - a) + 'px';
      };
      cards.forEach((el) => place(el, el.dataset.birth ? 0 : Math.min(1, ps[+el.dataset.i].lane)));
      const t0 = ps[0].from, t1 = Math.max(...ps.map((p) => p.to));
      // Piecewise scale: each start/end date is a key; long empty stretches are capped.
      const keys = [...new Set([...ps.flatMap((p) => [p.from, Math.min(p.to, t1)]), t1].map((t) => +t.toFixed(4)))].sort((a, b) => a - b);
      const ppy = narrow ? 120 : 150, cap = narrow ? 170 : 200, minSeg = 70;
      const seg = keys.slice(1).map((t, i) => Math.min(cap, Math.max(minSeg, (t - keys[i]) * ppy)));
      const birth = wrap.querySelector('.stop[data-birth]');
      const Y0 = birth.offsetHeight + 110;
      const y = (t) => {
        let acc = Y0;
        for (let i = 1; i < keys.length; i++) {
          if (t <= keys[i] + 1e-6) return acc + Math.max(0, t - keys[i - 1]) / (keys[i] - keys[i - 1]) * seg[i - 1];
          acc += seg[i - 1];
        }
        return acc;
      };
      // Make room so cards in the same column never overlap.
      const cols = {};
      cards.filter((el) => !el.dataset.birth).forEach((el) => {
        const p = ps[+el.dataset.i], col = narrow ? 0 : Math.min(1, p.lane);
        (cols[col] = cols[col] || []).push({ el, p });
      });
      Object.values(cols).forEach((list) => list.sort((a, b) => a.p.from - b.p.from).forEach((it, i, arr) => {
        if (!i) return;
        const need = arr[i - 1].el.offsetHeight + 36 - (y(it.p.from) - y(arr[i - 1].p.from));
        if (need > 0) { const k = keys.findIndex((t) => Math.abs(t - it.p.from) < 1e-3); seg[Math.max(0, k - 1)] += need; }
      }));
      const lastCard = Math.max(...cards.map((el) => (el.dataset.birth ? 0 : y(ps[+el.dataset.i].from) - 30 + el.offsetHeight)));
      const yEnd = Math.max(y(t1), lastCard - 20), H = yEnd + 90;
      wrap.style.height = H + 'px';
      birth.style.top = '0px';
      cards.forEach((el) => { if (!el.dataset.birth) el.style.top = (y(ps[+el.dataset.i].from) - 30) + 'px'; el._y = el.dataset.birth ? 30 : y(ps[+el.dataset.i].from); });
      const dots = [...wrap.querySelectorAll('.dot')];
      dots.forEach((d) => {
        const bx = d.dataset.birth ? x0 : laneX(ps[+d.dataset.i].lane), by = d.dataset.birth ? 30 : y(ps[+d.dataset.i].from);
        d.style.left = bx + 'px'; d.style.top = by + 'px'; d._y = by;
      });
      const now = wrap.querySelector('.now');
      now.style.left = x0 + 'px'; now.style.top = yEnd + 'px'; now._y = yEnd;
      const wig = narrow ? 18 : 90;
      const main = `M${x0} 0 L${x0} 30 C${x0 + sgn * wig} ${30 + (Y0 - 30) * .35}, ${x0 - sgn * wig} ${30 + (Y0 - 30) * .65}, ${x0} ${Y0} L${x0} ${yEnd}`;
      const branchPs = ps.filter((p) => p.lane > 0);
      const branches = branchPs.map((p) => {
        const xs = laneX(0), xl = laneX(p.lane), ys = y(p.from), ye = p.open ? yEnd : y(p.to), k = Math.min(70, (ye - ys) / 3);
        p._straight = [ys + k, p.open ? ye : ye - k]; p._range = [ys, ye];
        return p.open
          ? `M${xs} ${ys} C${xs} ${ys + k * .6}, ${xl} ${ys + k * .4}, ${xl} ${ys + k} L${xl} ${ye}`
          : `M${xs} ${ys} C${xs} ${ys + k * .6}, ${xl} ${ys + k * .4}, ${xl} ${ys + k} L${xl} ${ye - k} C${xl} ${ye - k * .4}, ${xs} ${ye - k * .6}, ${xs} ${ye}`;
      });
      let rungs = '';
      ov.forEach((o) => {
        const hi = o.a.lane > o.b.lane ? o.a : o.b, lo = hi === o.a ? o.b : o.a;
        const [s0, s1] = hi._straight || [y(o.s), y(o.e)];
        const from = Math.max(y(o.s), s0), to = Math.min(o.e >= t1 - 1e-6 ? yEnd : y(o.e), s1);
        for (let yy = from + 8; yy < to - 4; yy += 14) rungs += `M${laneX(lo.lane)} ${yy} L${laneX(hi.lane)} ${yy} `;
      });
      let ticks = '';
      // (no year ticks: the road is compressed, so equal years are not equal distances)
      const svg = wrap.querySelector('svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const roads = [main, ...branches];
      svg.querySelector('.base').innerHTML = roads.map((d) => `<path class="road" d="${d}"/>`).join('') + `<path class="tick" d="${ticks}"/>`;
      svg.querySelector('.lit').innerHTML = `<path class="rung" d="${rungs}"/>` + roads.map((d, i) => `<path class="prog ${i ? 'branch' : ''}" d="${d}"/>`).join('');
      svg.querySelector('.cars').innerHTML = roads.map((_, i) => `<circle class="car ${i ? 'alt' : ''}" r="${i ? 7 : 9}"/>`).join('');
      wrap.querySelectorAll('.band').forEach((b, i) => {
        const o = ov[i], bottom = o.e >= t1 - 1e-6 ? yEnd : y(o.e);
        b.style.top = y(o.s) + 'px'; b.style.height = (bottom - y(o.s)) + 'px';
      });
      wrap._y = { dots, cards, now, roads: [...svg.querySelectorAll('.lit .prog')], cars: [...svg.querySelectorAll('.car')], ranges: [null, ...branchPs.map((p) => p._range)] };
      roadScroll();
    }
    function roadScroll() {
      const wrap = document.getElementById('road');
      if (!wrap || !wrap._y) return;
      const r = wrap.getBoundingClientRect();
      const Y = Math.min(wrap.offsetHeight, Math.max(0, innerHeight * .62 - r.top));
      wrap.querySelector('.reveal-rect').setAttribute('height', Y);
      const g = wrap._y;
      g.roads.forEach((p, i) => {
        const car = g.cars[i], range = g.ranges[i], show = !range || (Y > range[0] && Y < range[1] + 4);
        car.style.opacity = show ? 1 : 0;
        if (show) { const pt = pointAtY(p, Y); car.setAttribute('cx', pt.x); car.setAttribute('cy', pt.y); }
      });
      [...g.dots, ...g.cards, g.now].forEach((el) => el.classList.toggle('reached', el._y <= Y + 2));
      wrap.querySelectorAll('.band').forEach((b) => b.classList.toggle('reached', b.offsetTop <= Y));
    }

    /* ============ Home: "lately" ticker ============ */
    function ticker() {
      const el = document.querySelector('.ticker');
      if (!el) return;
      const items = [...el.querySelectorAll('.tick-item')];
      let i = 0;
      items[0].classList.add('on');
      if (Site.reduced) return;
      const id = setInterval(() => {
        if (!el.isConnected) return clearInterval(id);
        items[i].classList.remove('on');
        i = (i + 1) % items.length;
        items[i].classList.add('on');
      }, 3200);
    }

    const art = (x) => `
      <div class="art-wrap" aria-hidden="true">
        <svg class="art" viewBox="0 0 400 400">
          <path class="s1" data-shape="12,.05,.03,.6" data-c="200,200,140"></path>
          <path class="s2" data-shape="4,.14,.06,.9" data-c="86,320,52"></path>
          <path class="s3" data-shape="8,.08,.05,.8" data-c="334,318,38"></path>
          <rect class="s4" x="266" y="30" width="112" height="44" rx="22"></rect>
          <path class="spark" d="M64 84 Q68 68 84 64 Q68 60 64 44 Q60 60 44 64 Q60 68 64 84Z"></path>
          <circle class="ring" cx="200" cy="200" r="176"></circle>
        </svg>
        <div class="me">${x.photoTag('', 360, 360)}</div>
        <div class="orbit">${['balance', 'dns', 'auto_stories', 'sports_esports'].map((i, n) => `<span class="sat" style="--n:${n}"><span class="ms">${i}</span></span>`).join('')}</div>
      </div>`;

    Site.init({
      id: 'final', lang: 'en', lockTheme: true, theme: { h: 252, c: 0.13 }, icons: ['home_pin', 'join_inner', 'flag', 'chevron_right', 'north_east'],

      shell: (c, x) => `
        <header class="topbar">
          <a class="mark" href="#/">${x.esc(c.initials)}</a>
          <span class="title-m who">${x.esc(c.name)}</span>
          <span class="grow"></span>
          ${x.modeBtn('icon-btn tonal ripple')}
        </header>
        <main id="view"></main>
        <footer class="foot">
          <div class="foot-in">
            <span class="body-s muted">© ${x.year} ${x.esc(c.name)}</span>
            <span class="foot-links">${x.socialLinks('icon-btn ripple')}</span>
          </div>
        </footer>
        ${x.toolbar()}`,

      mount() {
        const bar = document.getElementById('toolbar');
        let last = scrollY;
        window.onscroll = () => {
          const yy = scrollY;
          if (yy > last + 6 && yy > 160) bar.classList.add('hidden');
          if (yy < last - 6 || innerHeight + yy >= document.body.scrollHeight - 40) bar.classList.remove('hidden');
          last = yy;
          roadScroll();
        };
        window.onresize = layoutRoad;
      },

      after(page, c) {
        document.getElementById('toolbar')?.classList.remove('hidden');
        if (page === 'home') ticker();
        if (page === 'work') fetch('https://api.github.com/users/maolama').then((r) => r.json()).then((d) => { const el = document.getElementById('repo-count'); if (el && d.public_repos) el.textContent = d.public_repos; }).catch(() => {});
        if (page === 'journey') {
          document.getElementById('road')._d = periods(c);
          requestAnimationFrame(layoutRoad);
          document.fonts.ready.then(layoutRoad);
        }
      },

      pages: {
        home: (c, x) => {
          const e = x.esc, u = c.ui;
          const doors = [
            { href: '#/work', icon: 'science', t: u.research, d: c.research[0].title, tone: '' },
            { href: '#/work', icon: 'code', t: u.projects, d: `${c.projects.length}+ ${x.lang === 'fa' ? 'پروژه، چندتایی فقط برای سرگرمی' : 'projects, a few just for fun'}`, tone: 'secondary' },
            { href: '#/about', icon: 'auto_stories', t: u.loves, d: `${u.hobby.books} · ${u.hobby.screen} · ${u.hobby.games} · ${u.hobby.sport}`, tone: 'tertiary' },
          ];
          return `
          <section class="hero">
            <div class="hero-text">
              <span class="chip hello"><span class="ms wave">waving_hand</span>${e(c.hello)}</span>
              <h1 class="display-l">${e(c.name)}</h1>
              <p class="headline-s lede">${e(c.headline)}</p>
              <div class="tagrow">${c.tags.map((t) => `<span class="chip"><span class="ms">${t.icon}</span>${e(t.label)}</span>`).join('')}</div>
              <div class="actions">
                <a class="btn filled lg ripple" href="#/work">${e(u.seeWork)}<span class="ms flip">arrow_forward</span></a>
                <a class="btn tonal lg ripple" href="#/journey"><span class="ms">route</span>${e(u.readJourney)}</a>
              </div>
              <div class="soc">${x.socialLinks('icon-btn tonal ripple')}</div>
            </div>
            ${art(x)}
          </section>

          <div class="ticker" aria-live="polite">
            <span class="label-m tick-lbl">${e(u.now)}</span>
            <span class="tick-box">${c.now.map((n) => `<span class="tick-item"><span class="ms">${n.icon}</span><span class="body-m"><span class="muted">${e(n.label)}:</span> ${e(n.text)}</span></span>`).join('')}</span>
          </div>

          <section class="doors">
            ${doors.map((d, i) => `
              <a class="door ripple" href="${d.href}" data-reveal style="--i:${i}">
                <span class="icon-tile ${d.tone}"><span class="ms">${d.icon}</span></span>
                <span class="door-t"><span class="title-m">${e(d.t)}</span><span class="body-s muted">${e(d.d)}</span></span>
                <span class="ms go flip">arrow_forward</span>
              </a>`).join('')}
          </section>`;
        },

        work: (c, x) => {
          const e = x.esc, u = c.ui;
          // Small illustration per research item (index-matched to content.research).
          const arts = [
            // Thesis: a judge's scale tipping towards the long answer
            `<svg viewBox="0 0 300 150" aria-hidden="true">
              <line class="a-line" x1="150" y1="22" x2="150" y2="128"/><rect class="a-soft" x="118" y="126" width="64" height="8" rx="4"/>
              <g class="tilt"><line class="a-beam" x1="62" y1="44" x2="238" y2="44"/>
                <line class="a-line" x1="72" y1="44" x2="72" y2="70"/><line class="a-line" x1="228" y1="44" x2="228" y2="70"/>
                <g transform="translate(40 72)"><rect class="a-acc" width="64" height="7" rx="3.5"/><rect class="a-acc" y="11" width="56" height="7" rx="3.5"/><rect class="a-acc" y="22" width="64" height="7" rx="3.5"/><rect class="a-acc" y="33" width="48" height="7" rx="3.5"/><rect class="a-acc" y="44" width="60" height="7" rx="3.5"/></g>
                <g transform="translate(200 72)"><rect class="a-alt" width="56" height="7" rx="3.5"/></g></g>
              <circle class="a-acc" cx="150" cy="22" r="7"/></svg>`,
            // Reflect or Shift: simulated users drifting between recommenders
            `<svg viewBox="0 0 300 150" aria-hidden="true">
              ${[0, 1, 2, 3].map((i) => `<rect class="a-soft" x="${30 + i * 66}" y="20" width="44" height="30" rx="9"/><text class="a-txt" x="${52 + i * 66}" y="40">${['RND', 'SVD', 'LLM', 'LLM+'][i]}</text>`).join('')}
              ${Array.from({ length: 14 }, (_, i) => { const xx = 30 + (i % 7) * 40, yy = 92 + Math.floor(i / 7) * 30; return `<path class="a-link" d="M${xx} ${yy} Q ${xx} 70 ${52 + (i % 4) * 66} 52"/><circle class="${i % 3 ? 'a-acc' : 'a-alt'} drift" style="--d:${i * 0.3}s" cx="${xx}" cy="${yy}" r="7"/>`; }).join('')}</svg>`,
            // Verbosity bias: short vs. padded answers, the judge prefers the tall ones
            `<svg viewBox="0 0 300 150" aria-hidden="true">
              <line class="a-line" x1="24" y1="130" x2="276" y2="130"/>
              ${[[40, 70], [34, 82], [46, 74], [30, 88], [38, 78]].map(([a, b], i) => `<rect class="a-soft grow" style="--d:${i * 0.1}s" x="${36 + i * 48}" y="${130 - a}" width="16" height="${a}" rx="4"/><rect class="a-acc grow" style="--d:${i * 0.1 + 0.05}s" x="${54 + i * 48}" y="${130 - b}" width="16" height="${b}" rx="4"/>`).join('')}
              <text class="a-txt big" x="262" y="34">فا</text></svg>`,
          ];
          const tones = [0, -40, 180, -70, 160]; // blues, teal and amber only
          const projects = c.projects.map((p, i) => `
            <a class="repo k-${p.kind || 'project'}" data-kind="${p.kind || 'project'}" href="${p.url}" target="_blank" rel="noopener" data-reveal style="--i:${i % 6};--o:${tones[i % 5]}">
              <span class="repo-art"><span class="ms">${p.icon}</span></span>
              <span class="repo-body">
                <span class="title-m">${e(p.title)}</span>
                <span class="body-s muted">${e(p.desc)}</span>
                <span class="repo-foot"><span class="tags">${p.tags.map((t) => `<span class="tag">${e(t)}</span>`).join('')}</span>${x.brand('github', 'brand gh')}</span>
              </span>
            </a>`).join('');
          return `
          ${x.head('work')}
          <h2 class="title-l block-title" data-reveal>${e(u.research)}</h2>
          <div class="papers">${c.research.map((r, i) => {
            const [o, cl] = r.url ? [`<a class="paper ripple" href="${r.url}" target="_blank" rel="noopener" data-reveal style="--i:${i}">`, '</a>'] : [`<article class="paper" data-reveal style="--i:${i}">`, '</article>'];
            return `${o}<div class="paper-art">${arts[i] || ''}</div>
              <div class="paper-body"><div class="rc-top"><span class="status label-m">${e(r.status)}</span><span class="tag">${e(r.tag)}</span></div>
              <h3 class="title-l">${e(r.title)}</h3><p class="body-m muted">${e(r.desc)}</p>
              ${r.url ? `<span class="label-l code-link">${x.brand('github', 'brand')}${e(u.code)} <span class="ms flip">arrow_forward</span></span>` : ''}</div>${cl}`;
          }).join('')}</div>

          <div class="proj-head" data-reveal>
            <h2 class="title-l">${e(u.projects)}</h2>
            <div class="chips">${['all', 'project', 'fun'].map((k) => `<button class="chip filter ripple ${k === 'all' ? 'selected' : ''}" data-filter="${k}"><span class="ms chip-check">check</span>${e({ all: u.all, project: 'ML & LLMs', fun: u.fun }[k])}</button>`).join('')}</div>
          </div>
          <div class="repos">${projects}</div>

          <a class="gh-strip ripple" href="${SITE.github}" target="_blank" rel="noopener" data-reveal>
            ${x.brand('github', 'brand gh-big')}
            <span class="gh-text"><span class="headline-s"><span id="repo-count">40+</span> public repositories</span><span class="body-m muted">From Tetris in my first year to LLM alignment today. github.com/maolama</span></span>
            <span class="ms flip">arrow_forward</span>
          </a>`;
        },

        blog: (c, x) => `
          ${x.head('blog')}
          <div class="empty" data-reveal>
            <svg viewBox="0 0 200 140" aria-hidden="true"><rect class="e-page" x="52" y="18" width="96" height="112" rx="10"/><line class="e-line" x1="68" y1="44" x2="132" y2="44"/><line class="e-line" x1="68" y1="62" x2="124" y2="62"/><line class="e-line" x1="68" y1="80" x2="116" y2="80"/><path class="e-pen" d="M150 92 l20 -20 l10 10 l-20 20 l-14 4 z"/></svg>
            <p class="body-l muted">No posts yet.</p>
          </div>`,

        about: (c, x) => `
          ${x.head('about')}
          <div class="about-layout">
            <div class="about-story" data-reveal>
              ${c.story.map((p) => `<p class="body-l">${x.rich(p)}</p>`).join('')}
              <p class="fun body-m"><span class="ms">lightbulb</span><span>${x.esc(c.funFact)}</span></p>
            </div>
            <figure class="about-photo" data-reveal style="--i:1">
              <div class="shape-frame"><svg viewBox="0 0 100 100" aria-hidden="true"><path data-shape="10,.06,.03,.5" data-c="50,50,46"></path></svg>${x.photoTag('photo')}</div>
            </figure>
          </div>
          <section class="block"><h2 class="block-title title-l" data-reveal>${x.esc(c.ui.focus)}</h2>${x.focus()}</section>
          <section class="block"><h2 class="block-title title-l" data-reveal>${x.esc(c.ui.loves)}</h2>${x.reading()}<div data-reveal>${x.hobbies()}</div></section>
          ${SITE.quotes?.length ? `<section class="block"><h2 class="block-title title-l" data-reveal>${x.esc(c.ui.quotes)}</h2>${x.quotes()}</section>` : ''}`,

        journey: (c, x) => {
          const e = x.esc, u = c.ui;
          const { ps, ov } = periods(c);
          const tEnd = Math.max(...ps.map((p) => p.to));
          const range = (a, b) => (b >= tEnd - 1e-6 ? `${x.num(yr(a))}–${e(u.today)}` : `${x.num(yr(a))}–${x.num(yr(b))}`);
          const card = (p, i) => {
            const notes = ov.filter((o) => o.a === p || o.b === p).map((o) => {
              const other = o.a === p ? o.b : o.a;
              return `<p class="ov-note"><span class="ms">join_inner</span><span>${e(u.alongside)} <b>${e(other.j.title)}</b> · ${range(o.s, o.e)}</span></p>`;
            }).join('');
            const org = p.j.url ? `<a class="org-link" href="${p.j.url}" target="_blank" rel="noopener">${e(p.j.org)}<span class="ms">north_east</span></a>` : e(p.j.org);
            return `
              <span class="dot" data-i="${i}" aria-hidden="true"><span class="ms">${p.j.icon}</span></span>
              <article class="stop card ${p.kind}" data-i="${i}">
                <p class="label-l when">${e(p.j.when)}</p>
                <h3 class="title-l">${e(p.j.title)}</h3>
                <p class="body-m org">${org}</p>
                <p class="body-m muted">${e(p.j.desc)}</p>
                ${notes}
              </article>`;
          };
          return `
          ${x.head('journey', x.cvButtons())}
          <section class="roadmap" id="road">
            <svg aria-hidden="true">
              <defs><clipPath id="reveal" clipPathUnits="userSpaceOnUse"><rect class="reveal-rect" x="-50" y="0" width="100000" height="0"/></clipPath></defs>
              <g class="base"></g><g class="lit" clip-path="url(#reveal)"></g><g class="cars"></g>
            </svg>
            ${ov.map(() => `<div class="band" aria-hidden="true"></div>`).join('')}
            <span class="dot" data-birth="1" aria-hidden="true"><span class="ms">home_pin</span></span>
            <article class="stop card" data-birth="1">
              <p class="label-l when">${e(u.born)}</p>
              <h3 class="title-l">${e(c.born)}</h3>
            </article>
            ${ps.map(card).join('')}
            <span class="now" aria-hidden="true"><span class="ms">flag</span><span class="label-m">${e(u.today)}</span></span>
          </section>
          <div class="after-road">
            <section data-reveal style="--i:1"><h2 class="block-title title-l">${e(u.awards)}</h2>${x.awards()}</section>
            <section data-reveal style="--i:2"><h2 class="block-title title-l">${e(u.toolbox)}</h2><div class="chips">${c.skills.map((s) => `<span class="chip">${e(s)}</span>`).join('')}</div></section>
          </div>`;
        },
      },
    });
  </script>
</body>
</html>
